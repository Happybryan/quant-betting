name: kalshi-collect
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub runs scheduled jobs late under load; ~10-20 min in practice
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-data
          path: ghdata
      - run: python3 gh_collect.py ghdata
      - name: commit (single orphan commit; run files kept 7 days, so the branch never grows)
        run: |
          cd ghdata
          for d in runs/*/; do [ "$(basename $d)" \< "$(date -u -d '7 days ago' +%F)" ] && rm -rf "$d"; done; true
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git checkout -q --orphan snap
          git add -A
          git commit -qm "kalshi snapshot $(date -u +%FT%TZ)"
          git push -qf origin snap:gh-data
